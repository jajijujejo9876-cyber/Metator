    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Bungee&family=Share+Tech&display=swap" rel="stylesheet">

    <style>
      /* 1. Mencegah kedipan font (FOUT) */
      body {
        font-family: 'Share Tech', sans-serif !important;
        margin: 0;
        padding: 0;
        background-color: #f9fafb; /* Warna bg-gray-50 bawaan Anda */
      }

      /* 2. MEMBEKUKAN KERANGKA APLIKASI (Anti-Lompat/FOUC) */
      
      /* Mengunci tinggi layar penuh */
      html, body, #root {
        height: 100%;
      }

      /* Mengunci Pembungkus Utama (App.tsx root div) */
      #root > div {
        display: flex !important;
        flex-direction: column !important;
        min-height: 100vh !important;
      }

      /* Mengunci Header agar langsung melayang */
      header {
        position: fixed !important;
        top: 0;
        left: 0;
        width: 100%;
        height: 64px !important; /* setara h-16 */
        z-index: 50;
        box-sizing: border-box;
      }

      /* Mengunci Body Konten agar tidak nabrak header */
      main {
        display: flex !important;
        flex: 1 1 0% !important;
        padding-top: 64px !important; /* setara pt-16 */
        box-sizing: border-box;
        flex-direction: column;
      }

      /* Mengunci Layout Kiri-Kanan khusus untuk versi Desktop (Layar Lebar) */
      @media (min-width: 768px) {
        #root > div {
          height: 100vh !important;
          overflow: hidden !important;
        }
        main {
          flex-direction: row !important;
          overflow: hidden !important;
        }
        /* Kunci Lebar Sidebar Kiri */
        aside {
          width: 380px !important;
          flex-shrink: 0 !important;
          display: flex !important;
          flex-direction: column !important;
          height: 100% !important;
        }
        /* Kunci Area Konten Kanan */
        section {
          flex: 1 1 0% !important;
          display: flex !important;
          flex-direction: column !important;
          overflow: hidden !important;
        }
      }
    </style>
